name: CI

on:
  push:
  pull_request:

jobs:
  lint-compile:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check . --select F821,F822,F823,E7,E9

      - name: Compile
        run: |
          python -m compileall cyberdeck
          python -m py_compile main.py launcher.py

      - name: Build scripts smoke
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\build_windows_nuitka.ps1 -DryRun
          powershell -ExecutionPolicy Bypass -File .\scripts\build_windows_portable_nuitka.ps1 -DryRun

  tests:
    runs-on: windows-latest
    needs: lint-compile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          python -m coverage run -m unittest discover -s tests -p "test_*.py"

      - name: Coverage report
        run: |
          python -m coverage report
